<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Catalog Admin | Solar + BESS Platform</title>
    <link rel="stylesheet" href="./admin.css" />
  </head>
  <body>
    <div id="loginGate" class="login-gate hidden">
      <div class="login-card">
        <h1>Catalog Admin</h1>
        <p>Enter the admin password to manage the product catalog.</p>
        <input id="loginToken" type="password" placeholder="Admin password" />
        <button id="loginBtn" class="btn btn-primary">Sign in</button>
        <div id="loginError" class="error hidden"></div>
      </div>
    </div>

    <div id="adminShell" class="admin-shell hidden">
      <header class="admin-topbar">
        <div class="brand">
          <span class="brand-mark">A</span>
          <h1>Solar + BESS Catalog Admin</h1>
        </div>
        <nav class="tabs">
          <button class="tab active" data-tab="products">Products</button>
          <button class="tab" data-tab="categories">Categories</button>
          <button class="tab" data-tab="submissions">Submissions</button>
        </nav>
        <div class="top-actions">
          <a href="/" class="btn btn-ghost">Open App</a>
          <button id="logoutBtn" class="btn btn-ghost">Sign out</button>
        </div>
      </header>
      <main id="adminView" class="admin-view"></main>
    </div>

    <div id="modalBack" class="modal-back hidden">
      <div class="modal" id="modalBody"></div>
    </div>
    <div id="toast" class="toast hidden"></div>
    <script src="./admin.js"></script>
  </body>
</html>
